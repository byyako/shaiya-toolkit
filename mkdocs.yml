site_name: Shaiya Toolkit
site_url: https://byyako.github.io/shaiya-toolkit/
site_description: Command-line and desktop tools for your own copy of Shaiya game data.
site_author: byyako
copyright: MIT licence. Made by byyako.
docs_dir: docs
site_dir: site
theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Switch to light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Follow the system theme}
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/byyako/shaiya-toolkit
      name: Source on GitHub
    - icon: fontawesome/solid/mug-hot
      link: https://buymeacoffee.com/tylernol
      name: Support the project
plugins:
  - search
hooks:
  - .github/docs-site/hooks.py
watch:
  - CHANGELOG.md
  - CONTRIBUTING.md
  - SECURITY.md
  - .github/docs-site
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Home: README.md
  - Install: install.md
  - Getting started: getting-started.md
  - Tools:
      - shaiya CLI: tools/shaiya.md
      - Shaiya Toolkit (desktop app): tools/toolkit.md
      - Shaiya SVMap Editor: tools/svmap-editor.md
  - Guides:
      - Mod game files: guides/mod-files.md
      - Make a patch: guides/make-a-patch.md
      - SData files: guides/sdata-files.md
      - Replacing an animation: guides/replacing-an-animation.md
      - Undo and recovery: guides/undo-and-recovery.md
      - Client health and clean-up: guides/client-health.md
  - Formats:
      - Overview: formats/README.md
      - Archive: formats/archive.md
      - Patch: formats/patch.md
      - Version.ini and UpdateVersion.ini: formats/version-ini.md
      - SData wrapper: formats/sdata-wrapper.md
      - SVMap (.svmap): formats/svmap.md
      - World (.wld): formats/wld.md
      - World area names (.txt): formats/area-txt.md
      - Map.ini and MapWar.ini: formats/map-ini.md
      - Obelisk.ini: formats/obelisk-ini.md
      - NpcQuest.SData: formats/npcquest.md
      - Monster.SData: formats/monster.md
      - Item.SData: formats/item-sdata.md
      - Skill.SData: formats/skill-sdata.md
      - Dungeon floors (.dg): formats/dg.md
      - Models (.smod): formats/smod.md
      - Animations (.ANI): formats/ani.md
      - Skinned meshes (.3DC): formats/3dc.md
      - Vertex-animated models (.VANI): formats/vani.md
      - Building motion (.MANI): formats/mani.md
      - Textures: formats/textures.md
      - sysmsg and map names: formats/sysmsg.md
      - TacticsZone.zon: formats/tacticszone-zon.md
      - Afterglow mobs.psv: formats/mobs-psv.md
      - SVMap Editor's own files: formats/svmap-editor-files.md
      - Toolkit files in a client folder: formats/toolkit-files.md
  - Version matrix: version-matrix.md
  - FAQ: faq.md
  - Developer docs:
      - Architecture: dev/architecture.md
      - GUI shell: dev/gui-shell.md
      - Testing: dev/testing.md
      - Releasing: dev/releasing.md
      - Adding a tool: dev/adding-a-tool.md
      - Editing these docs: dev/docs-site.md
      - Contributing: contributing.md
      - Security: security.md
  - Changelog: changelog.md
