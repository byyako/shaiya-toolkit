name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never attach game files** (data.sah, data.saf, SData files, game.exe, patches made from client data). Hashes are enough.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - shaiya (command line)
        - Shaiya Archive & Patch Studio
        - A library (shaiya-core, shaiya-archive, shaiya-patch, shaiya-seed, ...)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `shaiya version`, or Help > About in a GUI.
      placeholder: "shaiya 0.1.0 (git 0123456789ab, x86_64-pc-windows-msvc)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / Ubuntu 24.04 / macOS 15"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client region and episode
      placeholder: "US ep4 patch 108"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Output of `shaiya info --hash --json` for the files involved
      description: Paste the JSON. It contains sizes, kinds and SHA-256 hashes, no file contents.
      render: json
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: The message, including the file name and byte offset if shown (in a GUI, use Details > Copy on the error banner).
