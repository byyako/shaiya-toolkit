name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev pkg-config
      - name: No game files
        run: cargo xtask guard
      - name: Third-party notices are up to date
        run: cargo xtask notices --check
      - name: Licences and network crates
        run: cargo xtask deps-check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev pkg-config
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Real window smoke (Windows, not blocking yet)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          ./target/debug/shaiya-toolkit.exe --no-settings --smoke smoke.txt
          cat smoke.txt
      - name: Screenshot of the demo client (Windows, not blocking yet)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cargo xtask demo-client "$RUNNER_TEMP/demo-client"
          ./target/debug/shaiya-toolkit.exe "$RUNNER_TEMP/demo-client" --shot shot.png --scene archive
          test -s shot.png
      - name: Real window smoke of the SVMap Editor (Windows, not blocking yet)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: ./target/debug/shaiya-svmap-editor.exe --smoke smoke-editor.png && test -s smoke-editor.png

  test-macos:
    # macOS minutes count ten times on private repositories: main, pull requests, tags and manual runs only
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
