[package]
name = "shaiya-patch"
description = "Shaiya psNNNN.patch files: build (streaming), list, verify, plan, apply with journal, and Ed25519 signatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `#[derive(Serialize)]` on the report types (the command line's --json).
serde = ["dep:serde", "shaiya-archive/serde"]

[dependencies]
shaiya-core = { workspace = true }
shaiya-archive = { workspace = true }
zip = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
shaiya-testkit = { workspace = true }
