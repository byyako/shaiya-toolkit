[package]
name = "shaiya-core"
description = "Shared basics for the Shaiya toolkit: errors, jobs and progress, safe file writing, a bounds-checked reader, text encodings, hashing, UTC time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
encoding_rs = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# The data folder rule and the shared client list (`shaiya_core::config`).
config = ["dep:serde", "dep:serde_json"]
