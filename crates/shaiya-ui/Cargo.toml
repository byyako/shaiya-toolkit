[package]
name = "shaiya-ui"
description = "The GUI shell of the Shaiya toolkit programs: window, menus, settings, tasks, log, recovery, backups, undo, command palette, test harness"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Headless test harness (`shaiya_ui::testing::Harness`) for the tools' own tests.
testing = []

[dependencies]
shaiya-core = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
rfd = { workspace = true, features = ["xdg-portal"] }
