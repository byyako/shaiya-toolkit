[package]
name = "shaiya-archive"
description = "Shaiya data.sah/data.saf archives: index parsing and editing, read access, compaction, safe in-place edits with undo, pack, diff, swap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `#[derive(Serialize)]` on the report types (the command line's --json).
serde = ["dep:serde"]

[dependencies]
shaiya-core = { workspace = true }
encoding_rs = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
shaiya-testkit = { workspace = true }
