[package]
name = "shaiya-toolkit"
description = "Shaiya Toolkit: browse and edit client archives with a backup, build, sign and apply patches, SData shortcuts, file inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "shaiya-toolkit"
path = "src/main.rs"

[dependencies]
shaiya-core = { workspace = true, features = ["config"] }
shaiya-archive = { workspace = true }
shaiya-patch = { workspace = true }
shaiya-seed = { workspace = true }
shaiya-inspect = { workspace = true }
shaiya-clientdata = { workspace = true }
shaiya-sdata = { workspace = true }
shaiya-ui = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cpal = { workspace = true, optional = true }

[features]
default = ["audio"]
# Playing the sounds of the Archive tab (cpal: WASAPI, CoreAudio, ALSA). Without it the Toolkit builds without an audio library and the
# preview says so.
audio = ["dep:cpal"]

[build-dependencies]
shaiya-build = { workspace = true }

[dev-dependencies]
shaiya-ui = { workspace = true, features = ["testing"] }
shaiya-testkit = { workspace = true }
shaiya-seed = { workspace = true }
