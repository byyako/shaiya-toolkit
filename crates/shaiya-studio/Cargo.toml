[package]
name = "shaiya-studio"
description = "Shaiya Archive & Patch Studio: inspect Shaiya files (the T0 shell; archive browsing and patches arrive next)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "shaiya-studio"
path = "src/main.rs"

[dependencies]
shaiya-core = { workspace = true }
shaiya-inspect = { workspace = true }
shaiya-ui = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
shaiya-build = { workspace = true }

[dev-dependencies]
shaiya-ui = { workspace = true, features = ["testing"] }
shaiya-testkit = { workspace = true }
shaiya-seed = { workspace = true }
