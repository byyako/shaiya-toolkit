[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["byyako"]
repository = "https://github.com/byyako/shaiya-toolkit"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# internal crates
shaiya-core = { path = "crates/shaiya-core" }
shaiya-seed = { path = "crates/shaiya-seed" }
shaiya-archive = { path = "crates/shaiya-archive" }
shaiya-patch = { path = "crates/shaiya-patch" }
shaiya-clientdata = { path = "crates/shaiya-clientdata" }
shaiya-svmap = { path = "crates/shaiya-svmap" }
shaiya-inspect = { path = "crates/shaiya-inspect" }
shaiya-ui = { path = "crates/shaiya-ui" }
shaiya-testkit = { path = "crates/shaiya-testkit" }
shaiya-build = { path = "crates/shaiya-build" }
# external crates
encoding_rs = "0.8"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
embed-resource = "3"
miniz_oxide = "0.9"
base64 = "0.22"
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "clipboard", "links"] }
egui = "=0.37.0"
rfd = { version = "=0.18.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"          # the GUI catches task panics; the CLI maps a panic to exit 5

[profile.dev.package.miniz_oxide]       # patch deflate in tests
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.shaiya-seed]        # cipher loops
opt-level = 3
[profile.release.package.shaiya-archive]
opt-level = 3
[profile.release.package.shaiya-patch]
opt-level = 3
[profile.release.package.shaiya-clientdata]  # texture decoding
opt-level = 3
[profile.release.package.epaint]             # tessellation of long tables
opt-level = 3
[profile.release.package.egui]
opt-level = 3
[profile.release.package.miniz_oxide]        # patch deflate
opt-level = 3
[profile.dev.package.shaiya-seed]            # keeps the opt-in tests over real SData quick
opt-level = 3
[profile.release.package.shaiya-svmap]       # bit grid and map I/O
opt-level = 3
[profile.release.package.shaiya-svmap-tools]  # scans, pairing, checks
opt-level = 3
